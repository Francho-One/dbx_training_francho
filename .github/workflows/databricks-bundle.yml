# CI/CD for the dox_training Declarative Automation Bundle
#
# Flow
#   1. Push to any feature branch  -> validate + deploy to DEV (one isolated
#                                     deployment per branch: "[dev <sp>_<branch>]")
#   2. Pull request into main      -> validate dev + prod (required status check)
#                                     PR must be APPROVED before it can be merged
#                                     (enforced by the GitHub branch protection rule on main)
#   3. Approved PR merged to main  -> create production tag prod-YYYYMMDD-HHMMSS
#                                     -> deploy that tag to PROD (deploy only, no job run)
#
# Required GitHub repository secrets (service principal with OAuth M2M):
#   DATABRICKS_HOST           e.g. https://adb-7405610410794404.4.azuredatabricks.net
#   DATABRICKS_CLIENT_ID      service principal application (client) ID
#   DATABRICKS_CLIENT_SECRET  service principal OAuth secret
#
# Required GitHub settings (Settings -> Branches -> Branch protection rule for "main"):
#   - Require a pull request before merging, Require approvals: 1 (or more)
#   - Require status checks to pass: "validate-pr"
#   - Do not allow bypassing the above settings (blocks direct pushes to main)

name: databricks-bundle

on:
  push:
    branches: ['**']        # feature branches -> dev, main -> prod (tags are ignored)
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  # ---------------------------------------------------------------- DEV
  deploy-dev:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: dev-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Compute branch suffix
        # feature/my-change -> _feature_my_change (safe for folder + resource names)
        # (branch name passed via env, not inlined, to avoid script injection)
        env:
          BRANCH: ${{ github.ref_name }}
        run: echo "BRANCH_SUFFIX=_$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9' '_')" >> "$GITHUB_ENV"
      - name: Validate bundle (dev)
        run: databricks bundle validate -t dev --var="branch_suffix=${BRANCH_SUFFIX}"
      - name: Deploy bundle (dev)
        run: databricks bundle deploy -t dev --var="branch_suffix=${BRANCH_SUFFIX}"

  # ---------------------------------------------------------------- PULL REQUEST
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle (dev)
        run: databricks bundle validate -t dev
      - name: Validate bundle (prod)
        run: databricks bundle validate -t prod

  # ---------------------------------------------------------------- PROD
  release-prod:
    # Runs only when an (approved) PR is merged into main, or manually on main.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write        # needed to push the production tag
    concurrency:
      group: prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: databricks/setup-cli@main

      - name: Validate bundle (prod)
        run: databricks bundle validate -t prod

      - name: Create production tag
        run: |
          TAG="prod-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Production release $TAG (commit ${GITHUB_SHA::7})" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "PROD_TAG=$TAG" >> "$GITHUB_ENV"
          echo "### Production tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy tagged release (prod)
        run: |
          git checkout "$PROD_TAG"
          databricks bundle deploy -t prod
