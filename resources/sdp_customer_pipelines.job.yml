# Job that refreshes the customer pipeline (sdp_customer_pipeline_dp).
#
# Pipeline tasks cannot receive job parameters. The config file is set via
# the bundle variable dp_config_file (see databricks.yml), which ends up in
# the pipeline's `pipeline.config_path` setting.
resources:
  jobs:
    sdp_customer_pipelines_job:
      name: sdp_customer_pipelines_job
      description: Runs the @dp customer pipeline.
      max_concurrent_runs: 1
      tasks:
        - task_key: run_sdp_customer_pipeline_dp
          pipeline_task:
            pipeline_id: ${resources.pipelines.sdp_customer_pipeline_dp.id}
            full_refresh: false
      parameters:
        - default: job
          name: env
