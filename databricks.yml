# Declarative Automation Bundle for the dox_training repo.
# Deploys the two customer SDP pipelines (dlt API + dp API) and a job that
# runs them in sequence.
#
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run      -t dev sdp_customer_pipelines_job
#
# Change a config file at deploy time, e.g.:
#   databricks bundle deploy -t dev --var="dp_config_file=my_other_config.json"

bundle:
  name: dox_training

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the pipeline tables
    default: training
  schema:
    description: Schema for the pipeline tables (both pipelines share it; tables are prefixed dlt_ / dp_)
    default: default
  dlt_config_file:
    description: Config file name (in src/pipelines/config) for the @dlt pipeline
    default: sdp_pipeline_config_dlt.json
  dp_config_file:
    description: Config file name (in src/pipelines/config) for the @dp pipeline
    default: sdp_pipeline_config_dp.json
  deploy_root:
    description: >-
      Workspace folder the bundle is deployed to (not a user / CI service
      principal home folder). Dev and prod are separate workspaces, so both
      use the same path: code lands in <deploy_root>/files and jobs and
      pipelines reference it from there.
    default: /Workspace/Deployments/dox_training

targets:
  dev:
    # DEV workspace (host from the CI secret DATABRICKS_HOST of the GitHub
    # environment "dev"). Deployed to /Workspace/Deployments/dox_training.
    # `mode: development` is NOT used because it forces the user name into the
    # path; the same dev behaviour is set explicitly with presets instead.
    default: true
    workspace:
      root_path: ${var.deploy_root}
    presets:
      name_prefix: "[dev] "
      pipelines_development: true
      trigger_pause_status: PAUSED
    # Dev is a shared deployment (deployed by the CI service principal), so all
    # workspace users get CAN_MANAGE on the deployed job, pipeline and folder.
    permissions:
      - level: CAN_MANAGE
        group_name: users

  prod:
    # PROD workspace (host from the CI secret DATABRICKS_HOST of the GitHub
    # environment "prod"). Deployed by CI/CD with a service principal to
    # /Workspace/Deployments/dox_training, NOT the principal's home folder.
    # The permissions below are applied to that folder.
    mode: production
    workspace:
      root_path: ${var.deploy_root}
    permissions:
      - level: CAN_MANAGE
        user_name: balaji.raghu@one-consultants.com
      - level: CAN_VIEW
        group_name: users
